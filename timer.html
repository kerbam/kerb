<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HTML5 Video Text Overlay Flexbox</title>

  <!-- Content Security Policy that explicitly blocks Cloudflare analytics and locks down assets -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; upgrade-insecure-requests; style-src 'self' 'unsafe-inline' https://cloudflare.com https://googleapis.com; font-src 'self' https://gstatic.com; media-src 'self' https://mbcbeckley.com; script-src 'self' 'unsafe-inline' https://cloudflare.com">

  <!-- Secure Normalize CSS CDN with Subresource Integrity -->
  <link rel="stylesheet" href="https://cloudflare.com/ajax/libs/normalize/8.0.1/normalize.min.css" integrity="sha512-NhSC1YmyruXifcj/KFRWoC561YpHpc5Jtzgvbuzx5VozKpWvQ+4nXhPd7Y43wE41XIeWBE5CwZ313f30uaog7A==" crossorigin="anonymous" referrerpolicy="no-referrer">

  <!-- Google Fonts Payload -->
  <link rel="stylesheet" href="https://googleapis.com/css?family=Nobile:700,400|Gafata|Open+Sans:300&display=swap">
  <link rel="stylesheet" href="css/style.css">

  <style>
    body {
      background: #333;
      margin: 0;
      overflow: hidden;
    }
    .video-container {
      position: relative;
      width: 100vw;
      height: 100vh;
    }
    video {
      object-fit: cover;
      width: 100%;
      height: 100%;
    }
    .overlay-desc {
      background: rgba(0, 0, 0, 0);
      position: absolute;
      top: 0;
      right: 0;
      bottom: 0;
      left: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
    }
    h1 {
      color: white;
      font-family: 'Nobile', sans-serif;
      font-size: 15rem;
      margin: 0;
      text-align: center;
    }
  </style>
</head>
<body>

  <div class="video-container">
    <!-- crossorigin setting directly inside media source to clear security blocks -->
    <video autoplay loop muted playsinline crossorigin="anonymous">
      <source src="https://mbcbeckley.com/files/MBCBeckley/Graphics%20Resources/24553_fieryDestruction_HD_BG.mp4" type="video/mp4">
      Your browser does not support the video tag.
    </video>
    <div class="overlay-desc">
      <h1 id="counter">1</h1>
    </div>
  </div>

  <script>
    // Clean event structure bypassing the need for heavy jQuery scripts
    document.addEventListener("DOMContentLoaded", function() {
      const countElement = document.getElementById('counter');
      let countValue = Number(countElement.textContent);

      function updateClock() {
        countValue++;
        countElement.textContent = countValue;
      }

      updateClock();
      window.setInterval(updateClock, 1800);
    });
  </script>
</body>
</html>

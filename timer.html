<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HTML5 Video Text Overlay Flexbox</title>

  <!-- Enforce HTTPS and restrict resource origins -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; max-age=0; upgrade-insecure-requests; style-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com https://fonts.googleapis.com; font-src https://gstatic.com; media-src https://mbcbeckley.com; script-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com">

  <!-- Secure CDN links using modern versions and Subresource Integrity (SRI) -->
  <link rel="stylesheet" href="https://cloudflare.com" integrity="sha512-NhSC1YmyruXifcj/KFRWoC561YpHpc5Jtzgvbuzx5VozKpWvQ+4nXhPd7Y43wE41XIeWBE5CwZ313f30uaog7A==" crossorigin="anonymous" referrerpolicy="no-referrer">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Nobile:700,400|Gafata|Open+Sans:300&display=swap">

  <style>
    body {
      background: #333;
    }
    .video-container {
      position: relative;
    }
    video {
      height: auto;
      vertical-align: middle;
      width: 100%;
    }
    .overlay-desc {
      background: rgba(0, 0, 0, 0);
      position: absolute;
      top: 0;
      right: 0;
      bottom: 0;
      left: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    h1 {
      color: white;
      font-family: 'Nobile', sans-serif;
      font-size: 5rem; /* Fixed absolute pixel scaling issue */
      text-align: center;
    }
  </style>
</head>
<body>

  <div class="video-container">
    <!-- Added playsinline for mobile security/compatibility -->
    <video autoplay loop muted playsinline>
      <source src="https://mbcbeckley.com/files/MBCBeckley/Graphics%20Resources/24553_fieryDestruction_HD_BG.mp4" type="video/mp4">
      Your browser does not support the video tag.
    </video>
    <div class="overlay-desc">
      <h1 id="counter">1</h1>
    </div>
  </div>

  <script>
    // Executing scripts via clean DOM listeners instead of inline body attributes
    document.addEventListener("DOMContentLoaded", function() {
      const countElement = document.getElementById('counter');
      // Use textContent instead of innerHTML to prevent DOM-based XSS injection points
      let countValue = Number(countElement.textContent);

      function updateClock() {
        countValue++;
        countElement.textContent = countValue;
      }

      updateClock();

      // Removed string-based evaluation from setInterval to eliminate eval-like behavior
      window.setInterval(updateClock, 1800);
    });
  </script>
</body>
</html>

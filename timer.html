<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HTML5 Video Text Overlay Flexbox</title>

  <style>
    body {
      background: #333;
      margin: 0;
      overflow: hidden;
    }
    .video-container {
      position: relative;
      width: 100vw;
      height: 100vh;
    }
    video {
      object-fit: cover;
      width: 100%;
      height: 100%;
    }
    .overlay-desc {
      background: rgba(0, 0, 0, 0);
      position: absolute;
      top: 0;
      right: 0;
      bottom: 0;
      left: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
    }
    h1 {
      color: white;
      font-family: 'Open Sans', 'Helvetica Neue', sans-serif;
      font-size: 15rem;
      margin: 0;
      text-align: center;
    }
  </style>
</head>
<body>

  <div class="video-container">
    <video autoplay loop muted playsinline>
      <!-- Ensure the file '24553_fieryDestruction_HD_BG.mp4' is committed into this exact directory -->
      <source src="timer.mp4" type="video/mp4">
      Your browser does not support the video tag.
    </video>
    <div class="overlay-desc">
      <h1 id="counter">1</h1>
    </div>
  </div>

  <!-- Loading script as a secure external asset to bypass 'self' network restrictions -->
  <script src="timer.js"></script>
</body>
</html>

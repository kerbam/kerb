<!DOCTYPE html>
<html lang="en" >

<head>
  <meta charset="UTF-8">
  <title>HTML5 Video Text Overlay Flexbox</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/normalize/5.0.0/normalize.min.css">


    <link rel="stylesheet" href="css/style.css">
    <style>
        body {
          background: #333;
        }

        .video-container {
          position: relative;
        }

        video {
          height: auto;
          vertical-align: middle;
          width: 100%;
        }

        .overlay-desc {
          background: rgba(0, 0, 0, 0);
          position: absolute;
          top: 0;
          right: 0;
          bottom: 0;
          left: 0;
          display: flex;
          align-items: center;
          justify-content: center;
        }

        h1 {
          color: white;
          font-family: 'Nobile', sans-serif;
          font-size: 500px;
          text-align: center;
        }
    </style>

</head>

<body>

  <body onLoad="initClock()">
<link href='https://fonts.googleapis.com/css?family=Nobile:700,400' rel='stylesheet' type='text/css'>

<link href='https://fonts.googleapis.com/css?family=Gafata|Open+Sans:300' rel='stylesheet' type='text/css'>

<div class="video-container">
	   <video autoplay loop muted>
		     <source src="http://www.mbcbeckley.com/files/MBCBeckley/Graphics%20Resources/24553_fieryDestruction_HD_BG.mp4" type="video/mp4">
		     Your browser does not support the video tag.
	   </video>
<!--      <div id="overlay-desc">
        <h1 id="counter">1</h1>
     </div> -->
     <div class="overlay-desc">
        <h1 id="counter">1</h1>
     </div>
	</div>
  <script src='http://cdnjs.cloudflare.com/ajax/libs/jquery/2.1.3/jquery.min.js'></script>



    <script>
      var countElement = document.getElementById('counter');
      var countValue = Number(countElement.innerHTML);
      function updateClock() {
        Number(countElement.firstChild.nodeValue = countValue++);
      }

      function initClock() {
        updateClock();
        window.setInterval("updateClock()", 1800);
      }
    </script>




</body>

</html>
